<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato | Neon Force</title>

    <link rel="stylesheet" href="../src/css/estilo.css">

</head>

<body>

<header>

    <div class="logo-container">

        <img src="../src/assets/img/logo.png" id="logo">

        <h1 class="texto-logo">
            NEON <span>FORCE</span>
        </h1>

    </div>

    <nav>

        <ul>

            <li><a href="../index.html">Home</a></li>
            <li><a href="./portifolio.html">Portfólio</a></li>
            <li><a href="./sobre.html">Sobre</a></li>
            <li><a href="./contato.html">Contato</a></li>

        </ul>

    </nav>

</header>

<main class="pagina">

    <h1 class="titulo-pagina">CONTATO</h1>

    <div class="contato-grid">

        <!-- FORM -->

        <form class="formulario" id="formulario">

            <input type="text" id="nome" placeholder="Seu nome">

            <input type="email" id="email" placeholder="Seu email">

            <textarea id="mensagem" placeholder="Digite sua mensagem"></textarea>

            <button type="submit">
                Enviar
            </button>

        </form>

        <!-- INFO -->

        <div class="info-contato">

            <h2>Informações</h2>

            <p>📞 (11) 99999-9999</p>

            <p>📧 contato@neonforce.com</p>

            <p>📍 São Paulo - SP</p>

            <div class="redes">

                <span>🎮 Discord</span>
                <span>📸 Instagram</span>
                <span>🕹️ Twitch</span>

            </div>

        </div>

    </div>

</main>

<script src="../src/js/contato.js"></script>

</body>
</html>
